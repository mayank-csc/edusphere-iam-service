server:
  port: ${IAM_SERVER_PORT:8091}

spring:
  datasource:
    url: ${IAM_DB_URL:jdbc:mysql://192.168.128.220:3307/edusphere_iam_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${IAM_DB_USERNAME:iam_user}
    password: ${IAM_DB_PASSWORD:iam_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:192.168.128.220:9092}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

edusphere:
  kafka:
    topics:
      identity: edusphere.identity

logging:
  level:
    com.edusphere.iam: INFO
    org.springframework.kafka: WARN

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:86400000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
    frontend-redirect-uri: ${FRONTEND_REDIRECT_URI:http://localhost:3000/auth/callback}
  oauth2:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8091/api/v1/auth/oauth2/callback}
      token-uri: https://oauth2.googleapis.com/token
      userinfo-uri: https://www.googleapis.com/oauth2/v3/userinfo
      auth-uri: https://accounts.google.com/o/oauth2/auth
      scope: openid email profile
    microsoft:
      client-id: ${MICROSOFT_CLIENT_ID:}
      client-secret: ${MICROSOFT_CLIENT_SECRET:}
      redirect-uri: ${MICROSOFT_REDIRECT_URI:http://localhost:8093/api/v1/auth/oauth2/callback}
      token-uri: https://login.microsoftonline.com/common/oauth2/v2.0/token
      userinfo-uri: https://graph.microsoft.com/oidc/userinfo
      auth-uri: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
      scope: openid email profile
